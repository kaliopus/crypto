version: "3.8"

# vLLM OpenAI-compatible server for a 70B-class model.
# This file is what actually runs inside the Phala confidential VM
# (Intel TDX + NVIDIA H100/H200 Confidential Computing). The attestation
# Phala issues covers the exact contents of this file, so don't change
# it after you've verified it once without re-verifying.

services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: >
      --model ${MODEL_ID:-hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4}
      --served-model-name llama-70b
      --max-model-len ${MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization 0.92
      --api-key ${VLLM_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  vllm-cache:
